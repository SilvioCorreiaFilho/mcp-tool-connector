[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-connector"
version = "1.1.0"
description = "Run large MCP tool catalogs in production: per-role context slicing, failure isolation, circuit breaker, idempotent read cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Silvio Correia Filho" }]
keywords = ["mcp", "model-context-protocol", "agents", "llm", "tools", "circuit-breaker", "ai-infrastructure"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = []          # stdlib only, on purpose

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SilvioCorreiaFilho/mcp-tool-connector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
